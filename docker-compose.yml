services:

  web:
    build: .
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - web
    
  db:
    image: postgres:16.2-alpine3.19
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    expose:
      - "6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
  
volumes:
  postgres_data:
  redis_data:  
